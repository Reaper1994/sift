name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the secret scan covers every commit
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Secret scan (gitleaks, checksum-verified)
        run: |
          V=8.30.1
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt
          grep linux_x64 gitleaks_${V}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${V}_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner -v
      - name: Fail if a secrets file was committed
        run: |
          if git ls-files | grep -E '(^|/)sift\.env$'; then
            echo "::error::sift.env must never be committed"; exit 1
          fi
